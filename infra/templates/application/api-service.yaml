apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app
  namespace: argocd
spec:
  destination:
    namespace: app
    server: https://kubernetes.default.svc
  project: default
  source:
    helm:
      valueFiles:
      - ../helm-values/dev.yaml
    path: helm
    repoURL: https://github.com/Elyasaflehrer/rafael_home_assignment.git
    targetRevision: dev/initial
  syncPolicy:
    automated:
      enabled: true
    syncOptions:
    - CreateNamespace=true