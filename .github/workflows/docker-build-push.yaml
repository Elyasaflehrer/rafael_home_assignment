name: Build and Push Docker Image


on:
  push:
    branches:
      - main
      - dev/initial

jobs:
  build:
    if: "!contains(github.event.head_commit.message, 'Updated by action')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false  # needed for pushing version updates

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read and increment version
        id: version
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Read current version
          VERSION=$(cat VERSION)
          echo "Current version: $VERSION"

          # Split into major.minor
          IFS='.' read -r MAJOR MINOR <<< "$VERSION"
          MINOR=$((MINOR + 1))
          NEW_VERSION="$MAJOR.$MINOR"

          echo "New version: $NEW_VERSION"
          echo "VERSION=$NEW_VERSION" >> $GITHUB_ENV

          # Update VERSION file
          echo "$NEW_VERSION" > VERSION

          # Commit updated version back to repo
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add VERSION
          git commit -m "Updated by action $NEW_VERSION" || echo "No changes to commit"
          git push https://$PAT_TOKEN@github.com/${GITHUB_REPOSITORY}.git HEAD

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver: docker-container


      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ask_docs
          file: ask_docs/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rafeal-app:${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rafeal-app:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/rafeal-app:cache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/rafeal-app:cache,mode=max

      - name: Update dev env
        id: dev
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Read current version
          VERSION=$(cat VERSION)
          echo "Current version: $VERSION"

          git status

          # update dev.yaml 
          sed -i "s|tag: .*|tag: $NEW_VERSION|" helm-values/dev.yaml

          # Commit updated dev.yaml
          git add helm-values/dev.yaml
          git commit -m "Updated by action $NEW_VERSION" || echo "No changes to commit"
          git push https://$PAT_TOKEN@github.com/${GITHUB_REPOSITORY}.git HEAD


